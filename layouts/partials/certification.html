<section id="certification" class="relative w-full bg-white py-16 sm:py-20 border-b border-zinc-200/70">
  <div class="container relative mx-auto px-4 sm:px-6 md:px-8 max-w-4xl">
    <!-- Section Header -->
    <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950">
      Certifications
    </h2>

    <!-- Clean Certification List -->
    <div class="mt-8 divide-y divide-zinc-200">
      {{ range $.Site.Data.certification.certification }}
      <div class="py-4 first:pt-0 last:pb-0 flex flex-col sm:flex-row sm:items-baseline justify-between gap-1">
        <div>
          <div class="flex flex-wrap items-baseline gap-2">
            <h3 class="text-sm font-bold text-zinc-950">
              {{ .title }}
            </h3>
            <span class="text-zinc-400">/</span>
            <span class="text-xs text-zinc-800 font-semibold">
              {{ .provider }}
            </span>
            {{ if .url }}
            <a
              href="{{ .url }}"
              target="_blank"
              rel="noopener noreferrer"
              class="text-xs font-bold text-zinc-900 hover:text-zinc-950 hover:underline inline-flex items-center gap-1"
            >
              <span>Verify</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-zinc-600"></i>
            </a>
            {{ end }}
          </div>

          {{ if .skills }}
          <p class="mt-1 text-xs text-zinc-700 font-mono font-medium">
            {{ delimit .skills " · " }}
          </p>
          {{ end }}
        </div>

        <div class="text-xs font-mono font-medium text-zinc-700 flex-shrink-0">
          {{ .date }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
