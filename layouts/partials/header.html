<header class="fixed left-0 right-0 top-0 z-50 flex justify-center px-4 pt-6">
  <div class="w-[95%] rounded-3xl border border-slate-200/50 bg-white/70 shadow-lg backdrop-blur-xl transition-all duration-300 ease-in-out sm:w-auto">
    <div class="flex h-16 items-center justify-between gap-8 px-6 sm:justify-center">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-blue-600"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span class="text-xl font-bold tracking-tight text-slate-900">{{ .Site.Params.logoText | default .Site.Title }}</span>
      </a>

      <!-- Desktop Navigation -->
      <nav id="desktop-nav" class="relative hidden items-center gap-1 rounded-full bg-slate-100/50 p-1 sm:flex">
        <!-- Sliding indicator -->
        <div id="nav-indicator" class="absolute bottom-1 top-1 rounded-full bg-white shadow-sm transition-all duration-300 ease-out" style="left: 0; width: 0; opacity: 0;"></div>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" data-nav-link class="nav-link relative z-10 rounded-full px-4 py-1.5 text-sm font-medium text-slate-600 transition-colors duration-300 hover:text-blue-600">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>

      <!-- Mobile Menu Button -->
      <button id="mobile-menu-button" class="rounded-full p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 sm:hidden" aria-label="Open mobile menu" aria-expanded="false" aria-controls="mobile-menu">
        <span class="sr-only">Open main menu</span>
        <!-- Menu Icon -->
        <svg id="menu-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <!-- X Icon (hidden by default) -->
        <svg id="x-icon" class="hidden h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out sm:hidden">
      <div class="overflow-hidden">
        <div class="border-t border-slate-200/50 px-4 pb-4 pt-2">
          <div class="space-y-1">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" data-mobile-nav-link class="mobile-nav-link block rounded-xl px-3 py-2 text-base font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900">
              {{ .Name }}
            </a>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const menuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    const xIcon = document.getElementById('x-icon');
    const desktopNav = document.getElementById('desktop-nav');
    const indicator = document.getElementById('nav-indicator');
    const navLinks = document.querySelectorAll('[data-nav-link]');
    const mobileNavLinks = document.querySelectorAll('[data-mobile-nav-link]');

    // Function to check if link is active based on current URL
    function isLinkActive(href) {
      const currentHash = window.location.hash;
      const currentPath = window.location.pathname;
      
      if (href.startsWith('/#')) {
        // For hash links on homepage
        const linkHash = href.substring(1); // Get #section from /#section
        return currentPath === '/' && currentHash === linkHash;
      }
      return currentPath === href || currentPath.startsWith(href + '/') || (href !== '/' && currentPath.startsWith(href));
    }

    // Move indicator to a specific link
    function moveIndicatorTo(link) {
      if (!indicator || !link) return;
      
      // Update all link styles
      navLinks.forEach(l => {
        l.classList.remove('text-blue-600');
        l.classList.add('text-slate-600');
      });
      
      link.classList.add('text-blue-600');
      link.classList.remove('text-slate-600');
      
      indicator.style.left = link.offsetLeft + 'px';
      indicator.style.width = link.offsetWidth + 'px';
      indicator.style.opacity = '1';
    }

    // Update indicator based on current URL
    function updateIndicator() {
      if (!desktopNav || !indicator) return;
      
      let activeLink = null;
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (isLinkActive(href)) {
          activeLink = link;
        }
      });

      if (activeLink) {
        moveIndicatorTo(activeLink);
      }
    }

    // Update mobile nav active states
    function updateMobileNav(activeHref = null) {
      mobileNavLinks.forEach(link => {
        const href = link.getAttribute('href');
        const isActive = activeHref ? href === activeHref : isLinkActive(href);
        
        if (isActive) {
          link.classList.add('bg-blue-50', 'text-blue-600');
          link.classList.remove('text-slate-600');
        } else {
          link.classList.remove('bg-blue-50', 'text-blue-600');
          link.classList.add('text-slate-600');
        }
      });
    }

    // Handle click on nav links
    navLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        moveIndicatorTo(this);
      });
    });

    // Handle click on mobile nav links
    mobileNavLinks.forEach(link => {
      link.addEventListener('click', function() {
        const href = this.getAttribute('href');
        updateMobileNav(href);
      });
    });

    // Initial update
    updateIndicator();
    updateMobileNav();
    
    // Update on small delay to ensure DOM is ready
    setTimeout(updateIndicator, 50);

    // Update on hash change (for browser back/forward)
    window.addEventListener('hashchange', () => {
      updateIndicator();
      updateMobileNav();
    });

    // Intersection Observer for scroll-based indicator updates
    if (window.location.pathname === '/') {
      const sections = [];
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href.startsWith('/#')) {
          const sectionId = href.substring(2); // Get 'about' from '/#about'
          const section = document.getElementById(sectionId);
          if (section) {
            sections.push({ id: sectionId, element: section, link: link });
          }
        }
      });

      if (sections.length > 0) {
        const observerOptions = {
          root: null,
          rootMargin: '-20% 0px -60% 0px', // Trigger when section is in upper-middle of viewport
          threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const sectionData = sections.find(s => s.element === entry.target);
              if (sectionData) {
                moveIndicatorTo(sectionData.link);
                updateMobileNav('/#' + sectionData.id);
              }
            }
          });
        }, observerOptions);

        sections.forEach(section => {
          observer.observe(section.element);
        });
      }
    }

    // Mobile menu toggle
    if (menuButton && mobileMenu && menuIcon && xIcon) {
      menuButton.addEventListener('click', () => {
        const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
        menuButton.setAttribute('aria-expanded', !isExpanded);
        
        if (isExpanded) {
          mobileMenu.classList.remove('grid-rows-[1fr]');
          mobileMenu.classList.add('grid-rows-[0fr]');
        } else {
          mobileMenu.classList.remove('grid-rows-[0fr]');
          mobileMenu.classList.add('grid-rows-[1fr]');
        }
        
        menuIcon.classList.toggle('hidden');
        xIcon.classList.toggle('hidden');
      });

      // Close mobile menu on link click
      mobileNavLinks.forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.remove('grid-rows-[1fr]');
          mobileMenu.classList.add('grid-rows-[0fr]');
          menuIcon.classList.remove('hidden');
          xIcon.classList.add('hidden');
          menuButton.setAttribute('aria-expanded', 'false');
        });
      });
    }

    // Update indicator on window resize
    window.addEventListener('resize', updateIndicator);
  });
</script>
