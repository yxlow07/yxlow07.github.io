<header class="fixed left-0 right-0 top-0 z-50 flex justify-center px-4 pt-4 sm:pt-6">
  <div class="w-full max-w-4xl rounded-2xl border border-zinc-200/80 bg-white/90 px-4 py-2 shadow-sm backdrop-blur-md transition-all duration-300">
    <div class="flex h-11 items-center justify-between gap-6">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2.5 group">
        <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-zinc-950 text-[11px] font-bold text-white transition-colors group-hover:bg-zinc-800">
          YX
        </span>
        <span class="text-sm font-semibold tracking-tight text-zinc-900">Yu Xuan Low</span>
      </a>

      <!-- Desktop Navigation -->
      <nav id="desktop-nav" class="relative hidden items-center gap-0.5 rounded-full bg-zinc-100/70 p-1 md:flex">
        <!-- Sliding indicator -->
        <div id="nav-indicator" class="absolute bottom-1 top-1 rounded-full bg-white shadow-xs transition-all duration-200 ease-out" style="left: 0; width: 0; opacity: 0;"></div>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" data-nav-link class="nav-link relative z-10 rounded-full px-3 py-1 text-xs font-semibold text-zinc-700 transition-colors duration-200 hover:text-zinc-950">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>

      <!-- Right Action / Mobile Toggle -->
      <div class="flex items-center gap-3">
        <a href="{{ $.Site.Data.hero.cvLink | default "/CV_Low_Yu_Xuan.pdf" }}" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-zinc-300 bg-white px-3 py-1.5 text-xs font-bold text-zinc-900 shadow-2xs hover:bg-zinc-50 hover:text-zinc-950 transition-colors">
          <span>CV</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-zinc-600"></i>
        </a>

        <!-- Mobile Menu Button -->
        <button id="mobile-menu-button" class="rounded-lg p-1.5 text-zinc-800 hover:bg-zinc-100 hover:text-zinc-950 focus:outline-none md:hidden" aria-label="Open mobile menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="sr-only">Open main menu</span>
          <svg id="menu-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <svg id="x-icon" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-200 ease-in-out md:hidden">
      <div class="overflow-hidden">
        <div class="border-t border-zinc-200 px-1 pb-3 pt-2 mt-2">
          <div class="space-y-1">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" data-mobile-nav-link class="mobile-nav-link block rounded-lg px-3 py-1.5 text-sm font-semibold text-zinc-800 transition-colors hover:bg-zinc-100 hover:text-zinc-950">
              {{ .Name }}
            </a>
            {{ end }}
            <a href="{{ $.Site.Data.hero.cvLink | default "/CV_Low_Yu_Xuan.pdf" }}" target="_blank" class="mt-2 block rounded-lg bg-zinc-900 px-3 py-2 text-center text-xs font-semibold text-white">
              Download CV
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const menuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    const xIcon = document.getElementById('x-icon');
    const desktopNav = document.getElementById('desktop-nav');
    const indicator = document.getElementById('nav-indicator');
    const navLinks = document.querySelectorAll('[data-nav-link]');
    const mobileNavLinks = document.querySelectorAll('[data-mobile-nav-link]');

    // Function to check if link is active based on current URL
    function isLinkActive(href) {
      const currentHash = window.location.hash;
      const currentPath = window.location.pathname;
      
      if (href.startsWith('/#')) {
        // For hash links on homepage
        const linkHash = href.substring(1); // Get #section from /#section
        return currentPath === '/' && currentHash === linkHash;
      }
      return currentPath === href || currentPath.startsWith(href + '/') || (href !== '/' && currentPath.startsWith(href));
    }

    // Move indicator to a specific link
    function moveIndicatorTo(link) {
      if (!indicator || !link) return;
      
      // Update all link styles
      navLinks.forEach(l => {
        l.classList.remove('text-zinc-950', 'font-semibold');
        l.classList.add('text-zinc-500', 'font-medium');
      });
      
      link.classList.add('text-zinc-950', 'font-semibold');
      link.classList.remove('text-zinc-500');
      
      indicator.style.left = link.offsetLeft + 'px';
      indicator.style.width = link.offsetWidth + 'px';
      indicator.style.opacity = '1';
    }

    // Update indicator based on current URL
    function updateIndicator() {
      if (!desktopNav || !indicator) return;
      
      let activeLink = null;
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (isLinkActive(href)) {
          activeLink = link;
        }
      });

      if (activeLink) {
        moveIndicatorTo(activeLink);
      }
    }

    // Update mobile nav active states
    function updateMobileNav(activeHref = null) {
      mobileNavLinks.forEach(link => {
        const href = link.getAttribute('href');
        const isActive = activeHref ? href === activeHref : isLinkActive(href);
        
        if (isActive) {
          link.classList.add('bg-zinc-100', 'text-zinc-950', 'font-semibold');
          link.classList.remove('text-zinc-500');
        } else {
          link.classList.remove('bg-zinc-100', 'text-zinc-950', 'font-semibold');
          link.classList.add('text-zinc-500');
        }
      });
    }

    // Handle click on nav links
    navLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        moveIndicatorTo(this);
      });
    });

    // Handle click on mobile nav links
    mobileNavLinks.forEach(link => {
      link.addEventListener('click', function() {
        const href = this.getAttribute('href');
        updateMobileNav(href);
      });
    });

    // Initial update
    updateIndicator();
    updateMobileNav();
    
    // Update on small delay to ensure DOM is ready
    setTimeout(updateIndicator, 50);

    // Update on hash change (for browser back/forward)
    window.addEventListener('hashchange', () => {
      updateIndicator();
      updateMobileNav();
    });

    // Intersection Observer for scroll-based indicator updates
    if (window.location.pathname === '/') {
      const sections = [];
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href.startsWith('/#')) {
          const sectionId = href.substring(2); // Get 'about' from '/#about'
          const section = document.getElementById(sectionId);
          if (section) {
            sections.push({ id: sectionId, element: section, link: link });
          }
        }
      });

      if (sections.length > 0) {
        const observerOptions = {
          root: null,
          rootMargin: '-20% 0px -60% 0px', // Trigger when section is in upper-middle of viewport
          threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const sectionData = sections.find(s => s.element === entry.target);
              if (sectionData) {
                moveIndicatorTo(sectionData.link);
                updateMobileNav('/#' + sectionData.id);
              }
            }
          });
        }, observerOptions);

        sections.forEach(section => {
          observer.observe(section.element);
        });
      }
    }

    // Mobile menu toggle
    if (menuButton && mobileMenu && menuIcon && xIcon) {
      menuButton.addEventListener('click', () => {
        const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
        menuButton.setAttribute('aria-expanded', !isExpanded);
        
        if (isExpanded) {
          mobileMenu.classList.remove('grid-rows-[1fr]');
          mobileMenu.classList.add('grid-rows-[0fr]');
        } else {
          mobileMenu.classList.remove('grid-rows-[0fr]');
          mobileMenu.classList.add('grid-rows-[1fr]');
        }
        
        menuIcon.classList.toggle('hidden');
        xIcon.classList.toggle('hidden');
      });

      // Close mobile menu on link click
      mobileNavLinks.forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.remove('grid-rows-[1fr]');
          mobileMenu.classList.add('grid-rows-[0fr]');
          menuIcon.classList.remove('hidden');
          xIcon.classList.add('hidden');
          menuButton.setAttribute('aria-expanded', 'false');
        });
      });
    }

    // Update indicator on window resize
    window.addEventListener('resize', updateIndicator);
  });
</script>
